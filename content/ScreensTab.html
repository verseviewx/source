<div class="container-fluid overflow-auto">
    <div class="row py-2">
        <div class="col">
            <p class="h6">Screen Setup</p>

    <div class="row py-2">
        <div class="col-5">
            <input type="checkbox" id="screen_enableMainPresentation"> Enable Main Presentation<br>

            <p class="h6">Main Presentation Screen</p>
            <select class="form-select" aria-label="Select main screen" id="screen_mainScreenSelection">
                <option value="1" selected>Screen 1 1920x1080</option>
                <option value="2">Screen 2 1920x1080</option>
            </select>
        </div>
        <div class="col-5" id="screen_enableStageviewScreen">
            <input type="checkbox" id="screen_enableStageviewPresentation"> Enable Stage Presentation<br>

            <p class="h6">Stageview Screen</p>
            <select class="form-select" aria-label="Select stageview screen" id="screen_stageviewScreenSelection">
                <option value="1" selected>Screen 1 1920x1080</option>
                <option value="2">Screen 2 1920x1080</option>
            </select>
        </div>
    </div>
