<!-- HTML FOR THE SONG LYRICS CREATE PANEL (11/23/2023) -->


<div class="modal" tabindex="-1" id="p5">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Song Lyrics Create</h5>
            </div>
            <div class="modal-body">
                <div class="container-fluid">
                    <div class="row py-2">

                        <div class="col-6">
                            <label for="se_quickSlideID" class="form-label">Primary</label>
                            <textarea class="form-control primarytabs" id="se_quickSlideID" rows="24"></textarea>
                        </div>


                        <div class="col-6">
                            <label for="se_quickSlideID_2" class="form-label">Secondary</label>
                            <textarea class="form-control secondarytabs" id="se_quickSlideID_2" rows="24"></textarea>
                        </div>

                    </div>


                    <!-- ROW 7 Lyrics Create Buttons -->
                    <div class="row py-2">
                        <div class="col-10">
                            <a href="#" class="btn btn-light btn-sm" id="se_generateID">GENERATE SLIDES</a>
                            <a href="#" class="btn btn-secondary btn-sm" id="se_generateMunglishID">TRANSLITERATE</a>
                            <a href="#" class="btn btn-light btn-sm" id="se_generateCancelID">CANCEL</a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
