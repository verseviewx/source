<div class="container-fluid">
    <div class="row py-2">
        <div class="col-6 input-group-sm">
            <label for="songnav_category" class="form-label">CATEGORY</label>
            <select class="form-select form-select-sm" id="songnav_category" aria-label=".form-select-sm example">
                <option selected value="1">ALL</option>
                <option value="2">Malayalam 2022</option>
                <option value="3">Hindi</option>
            </select>
        </div>
        <div class="col-1"></div>
        <div class="col-5">
            <label for="songnav_tags" class="form-label">TAGS</label>
            <select class="form-select form-select-sm" id="songnav_tags" aria-label=".form-select-sm example">
                <option selected value="1">ALL</option>
                <option value="2">Praise</option>
                <option value="3">Worship</option>
            </select>
        </div>
    </div>

    <div class="row py-2">
        <div class="col-7 input-group-sm">
            <input type="text" class="form-control input-group-sm" placeholder="Search Song" id="songnav_editbox" spellcheck="false" aria-label="Search Song"
                aria-describedby="basic-addon1">
        </div>
        <div class="col-5">
            <div class="btn-group">
                <a href="#" class="btn btn-primary btn-sm" id="songnav_searchbutton" data-bs-toggle="tooltip" data-bs-placement="top" title="Search Within Song" aria-current="page">
                    <i class="bi-search"></i>
                </a>
                <a href="#" id="songnav_searchauthorbutton" class="btn btn-sm btn-primary" data-bs-toggle="tooltip" data-bs-placement="top" title="Search By Author">
                    <i class="bi-person"></i>
                </a>
                <a href="#" id="songnav_clearbutton" class="btn btn-sm btn-primary" data-bs-toggle="tooltip" data-bs-placement="top" title="Clear Search">
                    <i class="bi-x-circle"></i>
                </a>
            </div>
        </div>
    </div>
