<div class="modal" tabindex="-1" id="p6">

                    <div class="mb-3">
                        <label for="tb_presets" class="form-label">Presets</label>
                        <div class="d-flex">
                            <select id="tb_presets" class="form-select w-50 me-2">
                            </select>
                        </div>
                    </div>
                    
                    <!-- New name and description -->
                    <div class="mb-4" id="tb_newname">

                                <input type="text" class="form-control w-auto" id="tb_name" placeholder="New Name for Preset">
                            </div>
                            <div class="col">
                                <label for="tb_description" class="form-label">Preset Description</label>
                                <input type="text" class="form-control w-auto" id="tb_description" placeholder="Description for Preset">
                            </div>
                        </div>
                    </div>

                     <!-- Orientation -->
                     <div class="mb-4">
                        <h6 class="fw-semibold">Content Orientation</h6>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="Orientation" id="tb_orientHorizontal" value="Horizontal" checked>
                            <label class="form-check-label" for="tb_orientHorizontal">Horizontal</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="Orientation" id="tb_orientVertical" value="Vertical">
                            <label class="form-check-label" for="tb_orientVertical">Vertical</label>
                        </div>
                    </div>

                    <!-- Margins by clicking -->
                    <div class="mb-4">
                        <h6 class="fw-semibold">Margins</h6>
                        Click two points to highlight the location of the content area
                        <div class="row">
                            <div class="col">
                                <canvas id="tb_canvas" width="480" height="270"
                                        style="background-color: #0d6efd">
                                </canvas>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Maximum Font Size -->
                    <div class="mb-4">

                                <input type="range" value="80" min="8" max="200" step="1" id="tb_maxFontSize">

                    <!-- Options -->

                        <div class="row">

                                <div class="form-check">
