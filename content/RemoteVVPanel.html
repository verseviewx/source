<div class="modal" tabindex="-1" id="p1">

        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Remote VerseVIEW Setup</h5>
            </div>
            <div class="modal-body">



                <div class="container-fluid">
                    <!-- **** TWO COLUM GRID **** -->
                    <div class="row py-2">

                            <div class="row py-2">
                                <div class="col-10">
                                    <select class="form-select form-select-sm" aria-label="Select IP Address" id="configIPaddr">

                                    </select>
                                </div>
                            </div>

                            <label>Selected Address</label>
                            <div class="row py-2">
                                <div class="col-10">
                                    <input type="text" class="form-control form-control-sm" id="configRemoteHostname"

                                </div>

                                <div class="col-6">

                                </div>
                                -->

                            <label>Port</label>
                            <div class="row py-2">
                                <div class="col-6">
                                    <!-- Add tooltip with port number range -->
                                    <input type="text" class="form-control form-control-sm" id="configRemotePort"
                                        placeholder="49152 to 65535" aria-label="Port Number" value="50000"
                                        aria-describedby="basic-addon1">

                                </div>
                                <div class="col-6">
                                    <a href="#" class="btn btn-secondary btn-sm" id="saveRemoteVVSettings">ENABLE</a>
                                </div>

                        <div class="col-5">
                            <div class="row py-2">
                                <span id="remoteVVStatus">Remote VerseVIEW Disabled</span>
                            </div>

                            <label>Remote Link</label>
                            <select name="select" class="form-select form-select-sm" id="remoteVVRemoteFunc">
                                <option value=1>Control</option>

                                <option value=3>Stageview 2</option>

                                <option value=8>Lower Third B</option>
                                <option value=9>Lower Third C</option>
                                <option value=10>Lower Third D</option>
                                <option value=11>Lower Third D2</option>
